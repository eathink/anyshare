name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: Wrangler 打包检查（不部署）
        run: npx wrangler deploy --dry-run --outdir /tmp/anyshare-dist
